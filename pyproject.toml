[project]
name = "retail-agent"
version = "0.1.0"
description = "Data analysis chat assistant for retail executives"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "sqlglot>=25",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.2",
    "pyarrow>=16",
    "google-genai>=1.30",
    "langgraph>=0.6",
]

[project.scripts]
retail-agent = "retail_agent.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is offline. The BigQuery group is opt-in: uv run pytest -m bigquery
addopts = "-m 'not bigquery'"
markers = ["bigquery: runs against the real BigQuery dataset and needs Google Cloud credentials"]
filterwarnings = [
    # Results come back as DataFrames through google-cloud-bigquery, as in the runner supplied with
    # the brief. The library has announced that this will be deprecated in favour of pandas-gbq.
    "ignore:Retrieving DataFrames via google-cloud-bigquery is deprecated:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
